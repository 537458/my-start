apply plugin: 'com.android.application'

// 要把 APK 发给别人时，只改这一行：填内网穿透（cpolar / ngrok）给出的公网地址，
// 形如 "https://xxxx.cpolar.top/api/"。留空表示不烧地址，
// 由使用者自己在「设置 → 服务器地址」里填，那种包只有能连到你电脑的人才用得了。
def SHARE_API_BASE_URL = "https://39bd909b.r3.cpolar.cn/api/"

android {
    // 1. 新增 namespace 配置（必须，与 applicationId 保持一致）
    namespace "com.petshop"

    // 2. 升级 compileSdkVersion 到 34（AGP 8.4.0 最低要求 33，34 更稳定）
    compileSdkVersion 34
    // 可选：移除 buildToolsVersion（AGP 7.0+ 会自动匹配，无需手动指定）
    // buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.petshop"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // API 配置（支持环境切换）
        // 使用模拟器地址（10.0.2.2是模拟器访问宿主机的地址）
        buildConfigField "String", "API_BASE_URL", '"http://10.0.2.2:8080/api/"'
        buildConfigField "String", "API_TIMEOUT", '"30"'
    }

    // 多环境配置
    flavorDimensions "env"
    productFlavors {
        dev {
            dimension "env"
            // 开发环境使用模拟器地址（10.0.2.2是模拟器访问宿主机的地址）
            buildConfigField 'String', 'API_BASE_URL', '"http://10.0.2.2:8080/api/"'
        }
        prod {
            dimension "env"
            // 生产环境使用正式服务器地址，见文件开头的 SHARE_API_BASE_URL
            buildConfigField 'String', 'API_BASE_URL', '"' + SHARE_API_BASE_URL + '"'
        }
    }

    buildTypes {
        debug {
            // Debug 构建允许明文 HTTP（开发调试用）
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            // 借用 debug 签名，这样 assemble 出来的 release 包也是签过名的，
            // 没有签名配置的 release APK 装不上，别人拿到只会提示「未安装应用」
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release 构建禁止明文 HTTP
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }

    // 4. 新增 Java 编译版本配置（AGP 8.4.0 建议显式声明）
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 5. 启用 ViewBinding（替代 findViewById）
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    // release 打包时不做 lint 硬拦截：lintVital 在某些 AGP / lint 版本组合下会自己崩掉，
    // 把整个打包流程带崩，而它并不会影响 APK 能不能装、能不能跑
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// 5. 新增仓库配置（确保依赖能正常下载）
repositories {
    google()
    mavenCentral()
    maven { url 'https://maven.aliyun.com/repository/public/' }
    // Glide 依赖需要 jitpack 仓库（如果后续 Glide 下载失败，添加这行）
    // maven { url 'https://jitpack.io' }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // AndroidX 核心组件（升级到最新稳定版）
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.9.0'

    // 下拉刷新
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // 生命周期组件（MVVM 架构必需）
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.0'

    // 网络库（升级版本）
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // 图片加载（升级 Glide）
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    implementation 'androidx.datastore:datastore-core:1.2.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // 圆形头像
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // 骨架屏效果
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // 本地数据库（升级 Room）
    implementation 'androidx.room:room-runtime:2.5.2'
    annotationProcessor 'androidx.room:room-compiler:2.5.2'

    // JSON 解析
    implementation 'com.google.code.gson:gson:2.10.1'

    // 工具类
    implementation 'org.apache.commons:commons-lang3:3.13.0'

    // 安全存储组件（重要！加密存储 Token）
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // 排除旧版 kotlin-stdlib-jdk7/jdk8，避免与 kotlin-stdlib 1.8+ 重复类冲突
    // Kotlin 1.8.0 起 jdk7/jdk8 已合并到 kotlin-stdlib 中
    configurations.all {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}