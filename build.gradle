// Top-level build file
buildscript {
    repositories {
        google()
        // 1. 移除 jcenter()，替换为 mavenCentral()
        mavenCentral()
        // 2. 添加阿里云镜像（解决国内下载慢/超时问题）
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://maven.aliyun.com/repository/google/' }
    }
    dependencies {
        // 3. 升级 Android Gradle 插件版本（4.1.3 不兼容 Gradle 9.0.0）
        // 选择与 Gradle 9.0.0 兼容的版本（8.4.0 适配 Gradle 8.0+，可兼容 9.0）
        classpath 'com.android.tools.build:gradle:8.4.0'
    }
}

allprojects {
    repositories {
        google()
        // 同样移除 jcenter()，替换为 mavenCentral + 阿里云镜像
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://maven.aliyun.com/repository/google/' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}